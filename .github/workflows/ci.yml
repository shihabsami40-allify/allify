name: ALLIFY build check

on:
  push:
    branches: [main, allify-recovery-2026-11-17]
  pull_request:
    branches: [main, allify-recovery-2026-11-17]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
